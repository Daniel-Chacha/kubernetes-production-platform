
name: TaskFlow CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DB_PATH: /tmp/taskflow-ci.sqlite3
      DB_ENGINE: sqlite
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks-mngt-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tasks-mngt-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image owner
        id: vars
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Generate API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/task-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build API image archive
        uses: docker/build-push-action@v6
        with:
          context: ./app
          tags: task-api:${{ github.sha }}
          labels: ${{ steps.api-meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/task-api.tar

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/task-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build frontend image archive
        uses: docker/build-push-action@v6
        with:
          context: ./tasks-mngt-frontend
          tags: task-frontend:${{ github.sha }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/task-frontend.tar

      - name: Upload image archives
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-images-${{ github.sha }}
          path: |
            /tmp/task-api.tar
            /tmp/task-frontend.tar
          if-no-files-found: error
          retention-days: 1

  scan-images:
    name: Scan container images with Trivy
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Download image archives
        uses: actions/download-artifact@v4
        with:
          name: taskflow-images-${{ github.sha }}
          path: images

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: images/task-api.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          format: table

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: images/task-frontend.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          format: table

  publish-images:
    name: Publish scanned images to GHCR
    runs-on: ubuntu-latest
    needs: [build-images, scan-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned image archives
        uses: actions/download-artifact@v4
        with:
          name: taskflow-images-${{ github.sha }}
          path: images

      - name: Load scanned images
        shell: bash
        run: |
          set -euo pipefail
          docker load --input images/task-api.tar
          docker load --input images/task-frontend.tar
          docker image inspect "task-api:${GITHUB_SHA}" >/dev/null
          docker image inspect "task-frontend:${GITHUB_SHA}" >/dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish API image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SOURCE="task-api:${GITHUB_SHA}"
          TARGET="ghcr.io/${OWNER}/task-api"

          docker tag "$SOURCE" "${TARGET}:sha-${GITHUB_SHA}"
          docker push "${TARGET}:sha-${GITHUB_SHA}"

          docker tag "$SOURCE" "${TARGET}:latest"
          docker push "${TARGET}:latest"

      - name: Tag and publish frontend image
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SOURCE="task-frontend:${GITHUB_SHA}"
          TARGET="ghcr.io/${OWNER}/task-frontend"

          docker tag "$SOURCE" "${TARGET}:sha-${GITHUB_SHA}"
          docker push "${TARGET}:sha-${GITHUB_SHA}"

          docker tag "$SOURCE" "${TARGET}:latest"
          docker push "${TARGET}:latest"
