name: Deploy to Minikube

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TaskFlow CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: taskflow-minikube-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TaskFlow
    runs-on: [self-hosted, linux, x64]
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.event == 'push')

    steps:
      - name: Preflight checks
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          echo "Kubernetes context:"
          kubectl config current-context

          kubectl get namespace portfolio
          kubectl -n portfolio get deployment task-api
          kubectl -n portfolio get deployment task-frontend

      - name: Prepare image references
        id: image
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
            DEPLOY_SHA="${GITHUB_SHA}"

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            fi

            TAG="sha-${DEPLOY_SHA}"

          echo "api=ghcr.io/${OWNER}/task-api:${TAG}" \
            >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/task-frontend:${TAG}" \
            >> "$GITHUB_OUTPUT"

      - name: Deploy API
        run: |
          kubectl -n portfolio set image deployment/task-api \
            task-api="${{ steps.image.outputs.api }}"

          kubectl -n portfolio rollout status deployment/task-api \
            --timeout=180s

      - name: Deploy frontend
        run: |
          kubectl -n portfolio set image deployment/task-frontend \
            frontend="${{ steps.image.outputs.frontend }}"

          kubectl -n portfolio rollout status deployment/task-frontend \
            --timeout=180s


      - name: Verify HTTPS endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..6}; do
            status=$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 15 \
              https://taskflow.test/ 2>/dev/null) || status="000"

            echo "HTTPS check attempt ${attempt}/6: HTTP ${status}"

            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "HTTPS endpoint is healthy."
              exit 0
            fi

            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "HTTPS endpoint remained unhealthy after 6 attempts."
          exit 1


      - name: Roll back application deployments on failure
        if: failure() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          echo "Deployment verification failed; attempting rollback."

          kubectl -n portfolio rollout undo deployment/task-api || true
          kubectl -n portfolio rollout undo deployment/task-frontend || true

          kubectl -n portfolio rollout status deployment/task-api \
            --timeout=180s || true

          kubectl -n portfolio rollout status deployment/task-frontend \
            --timeout=180s || true