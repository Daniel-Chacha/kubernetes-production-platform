
apiVersion: batch/v1
kind: Job
metadata:
  name: task-api-postgres-migrate
  namespace: portfolio
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: task-api-postgres-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: migrate
          image: task-api:1.1
          imagePullPolicy: Never
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: task-api-config
          env:
            - name: DB_ENGINE
              value: "postgres"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: DJANGO_SECRET_KEY
            - name: DB_NAME
              value: "taskflow"
            - name: DB_HOST
              value: "task-postgres"
            - name: DB_PORT
              value: "5432"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

