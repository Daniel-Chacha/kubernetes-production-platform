
global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'dmwita455@gmail.com'
  smtp_auth_username: 'dmwita455@gmail.com'
  smtp_auth_password_file: '/etc/alertmanager/secrets/gmail-app-password'
  smtp_require_tls: true

route:
  receiver: gmail-email
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: gmail-email
    email_configs:
      - to: 'dmwita455@gmail.com'
        send_resolved: true

