apiVersion: v1
kind: ConfigMap
metadata:
 name: prometheus-config
 namespace: monitoring
data:
 prometheus.yml: |
  global:
   scrape_interval: 15s
   evaluation_interval: 15s

  alerting:
    alertmanagers:
      - static_configs:
          - targets:
              - "alertmanager.monitoring.svc.cluster.local:9093"


  rule_files:
    - /etc/prometheus/rules/alert-rules.yml

  scrape_configs:
   - job_name: prometheus
     static_configs:
      - targets: ["localhost:9090"]

   - job_name: task-api
     metrics_path: /metrics
     static_configs:
       - targets: ["task-api.portfolio.svc.cluster.local:80"]  
