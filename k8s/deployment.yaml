apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: portfolio
  labels:
    app: task-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: task-api
          image: task-api:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: task-api-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: task-api-secret
                  key: DJANGO_SECRET_KEY
          volumeMounts:
            - name: task-api-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: task-api-data
          persistentVolumeClaim:
            claimName: task-api-data
