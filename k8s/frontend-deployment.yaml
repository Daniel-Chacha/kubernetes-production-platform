
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
  namespace: portfolio
  labels:
    app: task-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-frontend
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: frontend
          image: task-frontend:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              value: "http://task-api.portfolio.svc.cluster.local"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: task-frontend
  namespace: portfolio
spec:
  type: ClusterIP
  selector:
    app: task-frontend
  ports:
    - name: http
      port: 80
      targetPort: http

