
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-api-config
  namespace: portfolio
data:
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,task-api,task-api.portfolio.svc.cluster.local,10.244.0.1"
  DJANGO_DB_PATH: "/data/db.sqlite3"

  # Keep SQLite active until PostgreSQL schema and data are verified.
  DB_ENGINE: "postgres"

  # PostgreSQL connection settings for the upcoming migration.
  DB_NAME: "taskflow"
  DB_HOST: "task-postgres"
  DB_PORT: "5432"

